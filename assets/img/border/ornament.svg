<svg xmlns="http://www.w3.org/2000/svg" width="64" height="240" viewBox="0 0 64 240" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a22" />
      <stop offset="0.35" stop-color="#e6c66b" />
      <stop offset="0.55" stop-color="#c79a36" />
      <stop offset="0.8" stop-color="#efd382" />
      <stop offset="1" stop-color="#8a6a22" />
    </linearGradient>

    <!-- six-petal rosette, centered at origin -->
    <g id="flower">
      <g fill="url(#gold)">
        <ellipse cx="0" cy="-7.5" rx="3" ry="6.4" />
        <ellipse cx="0" cy="-7.5" rx="3" ry="6.4" transform="rotate(60)" />
        <ellipse cx="0" cy="-7.5" rx="3" ry="6.4" transform="rotate(120)" />
        <ellipse cx="0" cy="-7.5" rx="3" ry="6.4" transform="rotate(180)" />
        <ellipse cx="0" cy="-7.5" rx="3" ry="6.4" transform="rotate(240)" />
        <ellipse cx="0" cy="-7.5" rx="3" ry="6.4" transform="rotate(300)" />
      </g>
      <circle r="3.4" fill="#7a5a1a" />
      <circle r="1.4" fill="#f3dc8e" />
    </g>

    <!-- a curling leaf -->
    <path id="leaf" d="M0 0 C 7 -3 11 -9 9 -16 C 3 -12 -1 -7 0 0 Z" fill="url(#gold)" />
  </defs>

  <!-- double guard rules near the outer edge -->
  <rect x="7.5" y="0" width="1.4" height="240" fill="url(#gold)" />
  <rect x="12" y="0" width="0.8" height="240" fill="url(#gold)" />
  <!-- punctuation dots between the rules -->
  <g fill="#c79a36">
    <circle cx="10.2" cy="20" r="1.5" />
    <circle cx="10.2" cy="60" r="1.5" />
    <circle cx="10.2" cy="100" r="1.5" />
    <circle cx="10.2" cy="140" r="1.5" />
    <circle cx="10.2" cy="180" r="1.5" />
    <circle cx="10.2" cy="220" r="1.5" />
  </g>

  <!-- undulating central vine (seamless top/bottom: vertical tangents at y=0 and y=240) -->
  <path
    d="M38 0 C 38 20 50 40 50 60 C 50 80 38 100 38 120 C 38 140 26 160 26 180 C 26 200 38 220 38 240"
    stroke="url(#gold)"
    stroke-width="1.8"
    fill="none"
  />

  <!-- rosettes at the vine's crests -->
  <use href="#flower" transform="translate(50 60) scale(1.05)" />
  <use href="#flower" transform="translate(26 180) scale(1.05)" />

  <!-- leaf pair + bud at the mid crossing -->
  <use href="#leaf" transform="translate(38 120) rotate(-20)" />
  <use href="#leaf" transform="translate(38 120) scale(-1 1) rotate(20)" />
  <circle cx="38" cy="104" r="2.4" fill="url(#gold)" />

  <!-- small buds along the vine -->
  <circle cx="44" cy="30" r="2" fill="url(#gold)" />
  <circle cx="32" cy="150" r="2" fill="url(#gold)" />
  <circle cx="44" cy="210" r="2" fill="url(#gold)" />
</svg>
